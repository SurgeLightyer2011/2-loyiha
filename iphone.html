<script>
    let Phones = [
        {
            id: 9,
            nomi: "Instagram",
            narxi: 100,
            brend: "sayt",
            rasmi: ["https://avatars.mds.yandex.net/i?id=5640a377315095af5f95eab7cc7f3b59-4569576-images-thumbs&n=13"]

        },
        {

        },
        {
            id: 13,
            nomi: "Facebook",
            narxi: 320,
            brend: "sayt",
            rasmi: ["https://avatars.mds.yandex.net/i?id=36cb0bd6e718e24581d34eb2039801fdc1f891f1-5146892-images-thumbs&n=13"]
        },
        {
            id: 14,
            nomi: "Pinterest",
            narxi: 366,

        }
    ];

    function renderSites() {
        let container = document.getElementById("siteContainer");
        container.innerHTML = "";
        Phones.forEach(sayt => {
            let card = `
                <div class="col-md-3">
                    <div class="card">
                        <img src="${sayt.rasmi[0]}" class="card-img-top" alt="${sayt.nomi}">
                        <div class="card-body">
                            <h5 class="card-title">${sayt.nomi}</h5>
                            <p class="card-text">Brend: ${sayt.brend}</p>
                            <p class="card-text">Narxi: ${sayt.narxi} MB</p>
                            <a href="productDetail.html?id=${sayt.id}" class="btn btn-primary">Download</a>

            `;
            container.innerHTML += card;
        });
    }
    document.addEventListener("DOMContentLoaded", renderSites);
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
