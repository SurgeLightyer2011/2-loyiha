    <div class="container">
        <label for="login">Login kiriting:</label>
        <input type="text" id="login" class="form-control" placeholder="Loginni kiriting">

        <label for="password" class="mt-2">Parol kiriting:</label>
        <input type="password" id="parol" class="form-control" placeholder="Parolni kiriting">
   
        <button class="btn btn-primary mt-3" id="loginBtn">Login</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function (e) {
            document.querySelector("#loginBtn").addEventListener("click", function (e) {
                let login = document.querySelector("#login");
                let parol = document.querySelector("#parol");

                let loginVal = login.value.trim();
                let parolVal = parol.value.trim();

                if (loginVal === "admin" && parolVal === "123") {
                    localStorage.setItem("login", loginVal);
                    window.location.href = "index.html";
                    login.value = ""
                    parol.value = ""

                } else {
                    alert("Parol xato");
                }
            });
        });
    </script>
