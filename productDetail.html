<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="bg-dark text-white p-3">
        <div class="container d-flex justify-content-between align-items-center">
            <h1>Product Detail</h1>
            <a href="index.html" class="text-white">Back to Home</a>
        </div>
    </header>

    <main class="container my-5">
        <div class="row">
            <div class="col-md-6">
                <img id="product-image" class="img-fluid" alt="Product Image">
            </div>
            <div class="col-md-6">
                <h2 id="product-name"></h2>
                <p><strong></strong><span id="product-price"></span></p>
                <p><strong></strong><span id="product-brand"></span></p>
                <button class="btn btn-primary" style="width: 200px; justify-items: center;" >Download</button>
            </div>
        </div>
    </main>



    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
    <script src="productDetail.js"></script>
    <script src="./db.js"></script>

</body>
</html>
