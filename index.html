        const productList = document.getElementById('product-list');

        Phones.forEach(phone => {
            const productCard = `
                <div class="col-md-3">
                    <div class="card">
                        <img src="${phone.rasmi[0]}" class="card-img-top" alt="${phone.nomi}">
                        <div class="card-body">
                            <h5 class="card-title">${phone.nomi}</h5>
                            <p class="card-text">Brend: ${phone.brend}</p>
                            <p class="card-text">Narxi: ${phone.narxi} MB</p>
                            <a href="productDetail.html?id=${phone.id}" class="btn btn-primary">Download</a>
                        </div>
                    </div>
                </div>
            `;
            productList.innerHTML += productCard;
        });

        document.addEventListener("DOMContentLoaded", function() {
            let login = localStorage.getItem("login");
            const userInfo = document.getElementById('userInfo');

            if (login) {
                userInfo.innerHTML = `
                    <b id="exitIcon" style="color: black">${login}</b>
                    <svg xmlns="http://www.w3.org/2000/svg" id="exitIcon" style="color: black; margin-left: 15px" width="25" height="25" viewBox="0 0 16 16">
                        <path d="M2.146 2.854a.5.5 0 0 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8 2.146 2.854z"/>
                    </svg>
                `;

                const exitIcon = document.getElementById('exitIcon');
                exitIcon.addEventListener('click', function() {
                    localStorage.removeItem('login');
                    window.location.href = './login.html';
                });
            } else {
                userInfo.innerHTML = `
                    <a id="signInBtn" class="btn btn-outline-dark" href="./login.html" style="width: 125px; margin: 3px;" type="submit">Sign In</a>
